# Case splits for tuning the critic, based on data/manifests/sample_manifest.csv
# (90 cases = 3 systems x 5 services x 6 faults, one case per service/fault).
#
# dev:        all 30 Online Boutique cases. The critic prompt and rules were tuned on OB,
#             so critic results on these are not clean numbers.
# quick_dev:  6 OB cases, one per fault type, for fast prompt iteration.
# held_out:   all 30 Sock Shop + 30 Train Ticket cases (60). Don't inspect critic output on
#             these while tuning; report critic results on held_out.
#
# Use the globs with --cases, e.g. python -m src.run ... --cases "re2ob_*"
# run.py only runs cases listed in the manifest, so the globs only match those 90.

dev:
  - "re2ob_*"

quick_dev:
  - re2ob_checkoutservice_cpu_1
  - re2ob_currencyservice_mem_1
  - re2ob_emailservice_disk_3
  - re2ob_productcatalogservice_delay_3
  - re2ob_recommendationservice_loss_3
  - re2ob_emailservice_socket_1

held_out:
  - "re2ss_*"
  - "re2tt_*"
