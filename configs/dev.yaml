# Dev-time run config: small, cheap, for iterating locally.

config_name: triagerca # one of: retrieval_only, react, triagerca, triagerca_no_critic
model: pipeline_model # key into models.yaml
data_dir: data/raw/rcaeval # directory of RCAEval case dirs (git-ignored, download separately)
cases_limit: 1 # cap how many cases to run in dev
max_tool_calls: 6
max_iterations: 3
retriever: chroma # stub | chroma (chroma needs the index: python -m src.rag.embed)
critic: stub # stub (always accepts) | llm (LLMCritic; needs Ollama running), or --critic
critic_model: critic_14b # key into models.yaml; fixed for every run, independent of --model (7B critic ablation row: set open_weight_model here; critic_batch/critic_debug take --critic-model)
critic_evidence: full # full (whole ledger, spec v1.1 section 3.1) | cited (cited items only)
critic_comparisons: true # add a cross-service metric table computed from the ledger (ablation switch)
critic_onset_check: true # code check: reject if another service shifted more at onset than the claimed root (ablation switch)
cache_dir: .cache/llm
runs_dir: runs
