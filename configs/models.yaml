# Model names and per-1M-token list prices (for cost-per-incident reporting, even on free tier).
# Fill in / adjust after checking current Google AI Studio free-tier models and limits.

pipeline_model:
  provider: gemini
  name: gemini-3.8-flash # confirmed live against the free-tier key on 2026-09-26
  # Paid-tier list price as of 2026-10-18, valid through 2026-12-31 (rises to 1.50 / 7.50 on
  # 2027-01-01). Taken from third-party price trackers -- verify on ai.google.dev/pricing.
  price_per_1m_input_tokens: 0.75
  price_per_1m_output_tokens: 3.75
  # Throttle: spacing between calls to stay under the free-tier per-minute cap, which is 5 RPM
  # for this model (from the 429 error body, 2026-11-03) -- 60/5 = 12s, plus margin.
  min_interval_s: 13.0

open_weight_model:
  provider: openai_compat
  # Proposal allows "Llama 3.1 8B or Qwen2.5"; Qwen2.5 chosen for more reliable tool calling.
  # Served by Ollama (Q4_K_M weights). Start it with a large context, or Ollama silently
  # truncates long Executor conversations: see README "Open-weight model".
  name: qwen2.5:7b-instruct
  base_url: http://localhost:11434/v1
  price_per_1m_input_tokens: 0.0
  price_per_1m_output_tokens: 0.0
  min_interval_s: 0.0

grounding_judge_model:
  # Aeon: must be a different model family than pipeline_model (see CLAUDE.md Models section).
  provider: gemini
  name: gemini-3.8-flash # placeholder -- documented limitation until a second provider is added

critic_14b:
  # Critic experiment: Qwen2.5 14B (Q4_K_M) with an 8K context, so it fits 16 GB GPUs alongside less
  # KV cache. This is a local Ollama variant; create it once with:
  #   ollama pull qwen2.5:14b-instruct
  #   printf 'FROM qwen2.5:14b-instruct\nPARAMETER num_ctx 8192\n' > Modelfile && ollama create qwen2.5-14b-8k -f Modelfile
  provider: openai_compat
  name: qwen2.5-14b-8k
  base_url: http://localhost:11434/v1
  price_per_1m_input_tokens: 0.0
  price_per_1m_output_tokens: 0.0
  min_interval_s: 0.0
